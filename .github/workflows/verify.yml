name: Verify Swift HTML

on: [workflow_dispatch, push]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install Swift & Test
        run: |
          cat << 'EOF' > test.swift
          import Foundation

          let webhookBase = "https://webhook.site/82a37483-e4e2-4e58-a8ad-57242da47723"
          let testHTML = """
          <!DOCTYPE html>
          <html>
          <head>
              <link rel="stylesheet" href="\(webhookBase)/canary-style.css">
          </head>
          <body>
              <h1>Test Headline</h1>
              <img src="\(webhookBase)/canary-img.png" alt="tracker">
          </body>
          </html>
          """

          print("[*] Starting test on Linux Swift...")
          #if canImport(FoundationNetworking)
          import FoundationNetworking
          #endif

          let data = Data(testHTML.utf8)
          print("[+] Swift Data length: \(data.count)")
          EOF

          swift test.swift
